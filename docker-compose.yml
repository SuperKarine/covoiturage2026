services:

  # =========================
  # TRAEFIK (DEV COMMENTÉ)
  # =========================
  # traefik:
  #   image: traefik:v3.3
  #   container_name: ecoride-traefik
  #   command:
  #     - "--api.insecure=true"
  #     - "--providers.docker=true"
  #     - "--providers.docker.exposedbydefault=false"
  #     - "--entrypoints.web.address=:80"
  #   ports:
  #     - "80:80"
  #     - "8080:8080"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   networks:
  #     - ecoride_web


  # =========================
  # APP
  # =========================
  server:
    container_name: ecoride-server-1
    build: .
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www/html
    env_file:
      - .envTest
    depends_on:
      - db
    networks:
      - ecoride_web


  # =========================
  # DB
  # =========================
  db:
    container_name: ecoride-db-1
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ecoride-db-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - ecoride_web


  # =========================
  # PHPMYADMIN
  # =========================
  phpmyadmin:
    container_name: ecoride-phpmyadmin-1
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    ports:
      - "8086:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
    networks:
      - ecoride_web


  # =========================
  # PHPMYADMIN TEST
  # =========================
  phpmyadmin-test:
    container_name: ecoride-phpmyadmin-test-1
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    ports:
      - "8103:80"
    environment:
      PMA_HOST: db-test
      PMA_PORT: 3306
    depends_on:
      - db-test
    networks:
      - ecoride_web


  # =========================
  # PHPMYADMIN RECOVERY
  # =========================
  phpmyadmin-recovery:
    container_name: ecoride-phpmyadmin-recovery-1
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    ports:
      - "8120:80"
    environment:
      PMA_HOST: recovery-db
      PMA_PORT: 3306
    depends_on:
      - recovery-db
    networks:
      - ecoride_web


  # =========================
  # MONGO
  # =========================
  mongo:
    container_name: ecoride-mongo-1
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - ecoride-mongo-data:/data/db
    ports:
      - "27018:27017"
    networks:
      - ecoride_web


  mongo-express:
    container_name: ecoride-mongo-express-1
    image: mongo-express
    ports:
      - "8087:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
    depends_on:
      - mongo
    networks:
      - ecoride_web


  # =========================
  # TEST DB
  # =========================
  db-test:
    container_name: ecoride-db-test-1
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: ecoride_test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    volumes:
      - ecoride-db-test-data:/var/lib/mysql
    ports:
      - "3308:3306"
    networks:
      - ecoride_web


  # =========================
  # RECOVERY
  # =========================
  recovery-db:
    container_name: ecoride-recovery-db-1
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ecoride-recovery-db-data:/var/lib/mysql
    networks:
      - ecoride_web


volumes:
  ecoride-db-data:
  ecoride-db-test-data:
  ecoride-mongo-data:
  ecoride-recovery-db-data:

networks:
  ecoride_web:
    driver: bridge